version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smarthire-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smarthire_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smarthire-net

  mongodb:
    image: mongo:7.0
    container_name: smarthire-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - smarthire-net

volumes:
  mysql_data:
  mongo_data:

networks:
  smarthire-net:
    driver: bridge
