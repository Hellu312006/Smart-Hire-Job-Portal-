# In-memory H2 database for testing
spring.datasource.url=jdbc:h2:mem:smarthire_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Flyway disabled in test profile, schema created by Hibernate create-drop
spring.flyway.enabled=false

# MongoDB test settings
spring.data.mongodb.uri=mongodb://localhost:27017/smarthire_test

# JWT test properties
smarthire.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
smarthire.jwt.expiration-ms=3600000
smarthire.upload.dir=./target/test-uploads
