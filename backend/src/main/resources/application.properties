# ===================================================================
# SmartHire Recruitment Platform - Application Configuration
# ===================================================================

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# -------------------------------------------------------------------
# Database Configuration (Zero-Config Persistent Storage with MySQL Mode)
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/smarthire_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Migrations (Enabled when explicitly configured with MySQL)
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# -------------------------------------------------------------------
# MongoDB NoSQL Database Configuration
# -------------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI:mongodb://${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/${MONGODB_DATABASE:smarthire_nosql}?serverSelectionTimeoutMS=1000&connectTimeoutMS=1000}
spring.data.mongodb.auto-index-creation=false

# -------------------------------------------------------------------
# File Upload Configuration
# -------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
smarthire.upload.dir=${FILE_UPLOAD_DIR:./uploads}

# -------------------------------------------------------------------
# Security & JWT Configuration
# -------------------------------------------------------------------
smarthire.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
smarthire.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
smarthire.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# -------------------------------------------------------------------
# Swagger OpenAPI Documentation
# -------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
